name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    - name: Run Test Suite
      run: |
        pytest tests/ -v

  docker:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t mcp-volby-2026:ci .

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.AZURE_VM_HOST }}
        username: ${{ secrets.AZURE_VM_USER }}
        key: ${{ secrets.AZURE_SSH_KEY }}
        script: |
          set -e
          echo "==> Updating repository on Azure VM..."
          cd ~/app
          git fetch origin main
          git reset --hard origin/main
          echo "==> Rebuilding and restarting containers via docker compose..."
          docker compose up -d --build
          docker compose ps

    - name: Verify Live Deployment Healthcheck
      run: |
        echo "==> Verifying live service healthcheck..."
        for i in {1..12}; do
          if curl -fsSL "https://${{ secrets.AZURE_VM_HOST }}/health" | grep -q "healthy"; then
            echo "==> Deployment successful! Service is healthy on Azure VM."
            exit 0
          fi
          echo "Waiting for service to be healthy (attempt $i/12)..."
          sleep 5
        done
        echo "Healthcheck failed after 60 seconds."
        exit 1
